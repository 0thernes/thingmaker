name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html README.md _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Wait for the artifact to become visible
        # deploy-pages reads the artifact list straight after upload; the list API
        # is eventually consistent and can briefly report zero artifacts.
        run: sleep 25

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
