name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p dist
          zip -r "dist/thingmaker-$version.zip" index.html README.md tools samples -x '*.DS_Store'
          cd dist
          sha256sum "thingmaker-$version.zip" > "thingmaker-$version.zip.sha256"
          sha256sum -c "thingmaker-$version.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/thingmaker-$TAG.zip" "dist/thingmaker-$TAG.zip.sha256" --title "Thingmaker $TAG" --generate-notes
